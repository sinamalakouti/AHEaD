[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ahead"
version = "0.1.0"
description = "AHEaD: CULTIVateBench generation, proposer–refiner descriptors, and ALIGN/HAL/EXAG/DIV metrics."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AHEaD authors" }]
keywords = ["evaluation", "text-to-image", "cultural", "alignment", "hallucination", "diversity"]

dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
    "pillow",
    "sentence-transformers>=2.2",
    "transformers>=4.40",
    "accelerate",
    "openai>=1.0",
    "google-genai",
    "requests",
    "diffusers>=0.30",
    "t2v-metrics>=1.0",
    "open_clip_torch",
]

[project.urls]
Homepage = "https://github.com/sinamalakouti/AHEaD"

[tool.setuptools.packages.find]
where = ["."]
include = ["ahead*"]
